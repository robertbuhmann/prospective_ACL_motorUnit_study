name: Add mass to modelling data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add_mass_to_modelling_data.yml'

permissions:
  contents: write

jobs:
  add-mass:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add deidentified participant mass
        shell: python
        run: |
          import csv
          from pathlib import Path

          mass_by_id = {
              'P001': 61, 'P002': 71, 'P003': 60, 'P004': 75, 'P005': 104,
              'P006': 82, 'P007': 60, 'P008': 62, 'P009': 59, 'P010': 69,
              'P011': 59, 'P012': 51, 'P013': 72, 'P014': 73, 'P015': 70,
              'P016': 80, 'P017': 75, 'P018': 83, 'P019': 63, 'P020': 92,
              'P021': 70, 'P022': 83, 'P023': 54, 'P024': 88, 'P025': 90,
              'P026': 58, 'P027': 82,
          }

          path = Path('ModellingData.csv')
          with path.open('r', encoding='utf-8-sig', newline='') as f:
              reader = csv.DictReader(f)
              fields = list(reader.fieldnames)
              rows = list(reader)

          ids = {row['id'].strip() for row in rows}
          if ids != set(mass_by_id):
              raise RuntimeError(
                  f'Participant ID mismatch. Dataset IDs={sorted(ids)}; '
                  f'mass IDs={sorted(mass_by_id)}'
              )

          if 'mass' not in fields:
              fields.append('mass')

          for row in rows:
              row['mass'] = str(mass_by_id[row['id'].strip()])

          tmp = path.with_suffix('.tmp.csv')
          with tmp.open('w', encoding='utf-8', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=fields)
              writer.writeheader()
              writer.writerows(rows)
          tmp.replace(path)

          # Verification: 1660 rows, 27 participants, mass complete and constant.
          with path.open('r', encoding='utf-8', newline='') as f:
              check = list(csv.DictReader(f))
          assert len(check) == 1660
          assert {row['id'] for row in check} == set(mass_by_id)
          assert all(row['mass'] for row in check)
          for pid, mass in mass_by_id.items():
              assert {row['mass'] for row in check if row['id'] == pid} == {str(mass)}

      - name: Commit corrected modelling dataset
        run: |
          if git diff --quiet -- ModellingData.csv; then
            echo 'ModellingData.csv already contains the verified mass variable.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ModellingData.csv
          git commit -m 'Add participant mass to modelling dataset'
          git push
